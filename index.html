<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dành cho em ❤️</title>

        <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffb3c1);
    min-height: 100vh;
    scroll-behavior: smooth;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 0;
}

.container {
    width: 94%;
    max-width: 600px;
    padding: 20px;
}

.card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    padding: 30px 20px;
    margin-bottom: 25px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(10px);
    transition: transform 0.3s, box-shadow 0.3s;
}

@media(hover:hover) {
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.25);
    }
}

h1 {
    font-size: 24px;
    line-height: 1.5;
    color: #ff2e63;
    font-weight: 600;
}

/* Gallery: 2 cột, 2 dòng cố định */
.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, auto);
    gap: 12px;
}

.gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
}

.gallery-item img {
    width: 100%;
    aspect-ratio: 1; /* Vuông để vừa 2x2 */
    object-fit: cover;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

/* Emoji overlay */
.gallery-item::after {
    content: "❤️";
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 24px;
    pointer-events: none;
}

/* Hover/active */
.gallery-item img:active {
    transform: scale(0.96);
}

@media(hover:hover) {
    .gallery-item img:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
}

/* Responsive typography */
@media (max-width: 400px) {
    h1 {
        font-size: 20px;
    }
}
</style>
    </head>
    <body>

        <div class="container">

            <div class="card">
                <h1>
                    Anh nhớ em dữ vậy,<br>
                    chắc em bỏ bùa anh rồi! Hehe
                </h1>
            </div>

            <div class="gallery">
                <div class="gallery-item"><img src="img1.png" alt="Ảnh 1"></div>
                <div class="gallery-item"><img src="img2.png" alt="Ảnh 2"></div>
                <div class="gallery-item"><img src="img3.png" alt="Ảnh 3"></div>
                <div class="gallery-item"><img src="img4.png" alt="Ảnh 4"></div>
            </div>

        </div>

    </body>
</html>
